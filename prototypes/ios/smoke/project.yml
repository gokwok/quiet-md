name: QuietPrototypeSmoke
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  Prototype:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.s1dashu.quietmd.prototype
        EXECUTABLE_NAME: quiet_md_ios
  Smoke:
    type: bundle.ui-testing
    platform: iOS
    sources: [Smoke]
    dependencies:
      - target: Prototype
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.s1dashu.quietmd.prototype.smoke
        TEST_TARGET_NAME: Prototype
schemes:
  Smoke:
    build:
      targets:
        Prototype: all
        Smoke: [test]
    test:
      targets: [Smoke]
