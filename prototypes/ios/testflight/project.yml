name: Quiet
targets:
  Quiet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Assets.xcassets
      - path: quiet_md_ios
        buildPhase:
          copyFiles:
            destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.s1dashu.quietmd.prototype
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: QuietMd.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: mo molv dian qie zhe wu xuan
        EXECUTABLE_NAME: quiet_md_ios
        DEBUG_INFORMATION_FORMAT: dwarf
